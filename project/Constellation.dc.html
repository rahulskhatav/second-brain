<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-fbae0504-ff86-444f-94a4-32574ab9648d/styles.css">
<script src="_ds/nocturne-fbae0504-ff86-444f-94a4-32574ab9648d/_ds_bundle.js"></script>
</helmet>
<div style="position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%, #1c1f31 0%, #161826 55%, #121423 100%)">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;display:block">
    <g>
      <sc-for list="{{ dust }}" as="d" hint-placeholder-count="0">
        <circle cx="{{ d.x }}" cy="{{ d.y }}" r="{{ d.r }}" fill="{{ d.c }}"></circle>
      </sc-for>
    </g>
    <g>
      <sc-for list="{{ edges }}" as="e" hint-placeholder-count="0">
        <line x1="{{ e.x1 }}" y1="{{ e.y1 }}" x2="{{ e.x2 }}" y2="{{ e.y2 }}" stroke="{{ e.c }}" stroke-width="{{ e.w }}"></line>
      </sc-for>
    </g>
    <g style="filter:blur(9px)">
      <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="0">
        <circle cx="{{ n.x }}" cy="{{ n.y }}" r="{{ n.halo }}" fill="{{ n.haloC }}"></circle>
      </sc-for>
    </g>
    <g>
      <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="0">
        <circle cx="{{ n.x }}" cy="{{ n.y }}" r="{{ n.r }}" fill="{{ n.c }}"></circle>
      </sc-for>
    </g>
    <sc-if value="{{ focus }}" hint-placeholder-val="{{ false }}">
      <g>
        <circle cx="{{ focus.x }}" cy="{{ focus.y }}" r="{{ focus.ring }}" fill="none" stroke="#9184d9" stroke-width="1.25"></circle>
        <circle cx="{{ focus.x }}" cy="{{ focus.y }}" r="{{ focus.ring2 }}" fill="none" stroke="rgba(145,132,217,0.28)" stroke-width="1"></circle>
        <line x1="{{ focus.tx1 }}" y1="{{ focus.y }}" x2="{{ focus.tx2 }}" y2="{{ focus.y }}" stroke="rgba(145,132,217,0.5)" stroke-width="1"></line>
        <line x1="{{ focus.x }}" y1="{{ focus.ty1 }}" x2="{{ focus.x }}" y2="{{ focus.ty2 }}" stroke="rgba(145,132,217,0.5)" stroke-width="1"></line>
      </g>
    </sc-if>
  </svg>
  <sc-for list="{{ labels }}" as="l" hint-placeholder-count="0">
    <div style="{{ l.style }}">{{ l.t }}</div>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;showLabels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dim&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;focusIndex&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:-1,&quot;min&quot;:-1,&quot;max&quot;:47,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  build() {
    if (this._g) return this._g;
    let s = 20260728;
    const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const clusters = [
      { name: 'machine learning', cx: 420, cy: 300, rad: 150, c: '#b5abfc', n: 12 },
      { name: 'systems design',   cx: 745, cy: 585, rad: 135, c: '#cfd3e5', n: 10 },
      { name: 'urbanism',         cx: 1055, cy: 250, rad: 130, c: '#b2b6ca', n: 9 },
      { name: 'fermentation',     cx: 1145, cy: 665, rad: 115, c: '#b5afe8', n: 8 },
      { name: 'climate',          cx: 275, cy: 690, rad: 115, c: '#9397ab', n: 9 }
    ];
    const titles = [
      'Scaling laws are not a law of nature','What embeddings actually measure','The bitter lesson, revisited','A field guide to attention','Retrieval is the new fine-tuning','Small models, long context','Why evals rot','Tokenizers considered harmful','Distillation in practice','The quiet return of symbolic methods','Memory as a product surface','Latency is a design constraint',
      'Legible systems and their discontents','Build the thing that builds the thing','Notes on queues','Idempotency all the way down','Postgres is enough','The cost of a nine','Designing for the failure case','Observability without dashboards','Schemas as contracts','Migration is a social problem',
      'The fifteen-minute city, three years on','Streets are not for cars','Zoning as a love letter','What Vienna knows about rent','The sidewalk ballet','Parking minimums and their victims','Density without towers','Trams beat everything','The alley as public room',
      'A year of sourdough failures','Koji beyond the brewery','Salt, time, and patience','On garum','The chemistry of a crunchy pickle','Miso from anything','Vinegar mothers','Fermenting in a small kitchen',
      'Heat pumps eat gas boilers','The grid is the bottleneck','Cement has a problem','What a carbon price really does','Degrowth is a distraction','Solar past the duck curve','Adaptation is not surrender','The permitting knot','Batteries all the way down'
    ];
    const nodes = []; let ti = 0;
    clusters.forEach((cl, ci) => {
      for (let i = 0; i < cl.n; i++) {
        const a = rnd() * Math.PI * 2, d = Math.pow(rnd(), 0.62) * cl.rad;
        nodes.push({ x: +(cl.cx + Math.cos(a) * d * 1.15).toFixed(1), y: +(cl.cy + Math.sin(a) * d).toFixed(1), cluster: ci, c: cl.c, deg: 0, title: titles[ti++] || 'Untitled', tag: cl.name });
      }
    });
    const edges = [], seen = new Set();
    const link = (a, b) => {
      const k = a < b ? a + ':' + b : b + ':' + a;
      if (a === b || seen.has(k)) return; seen.add(k);
      nodes[a].deg++; nodes[b].deg++;
      edges.push([a, b]);
    };
    nodes.forEach((n, i) => {
      const near = nodes.map((m, j) => ({ j, d: Math.hypot(m.x - n.x, m.y - n.y) }))
        .filter(o => o.j !== i && nodes[o.j].cluster === n.cluster).sort((a, b) => a.d - b.d);
      const k = 1 + Math.floor(rnd() * 2.6);
      near.slice(0, k).forEach(o => link(i, o.j));
    });
    for (let i = 0; i < 7; i++) link(Math.floor(rnd() * nodes.length), Math.floor(rnd() * nodes.length));
    const maxDeg = Math.max.apply(null, nodes.map(n => n.deg));
    const out = nodes.map(n => {
      const t = n.deg / maxDeg;
      return { x: n.x, y: n.y, r: +(2.1 + t * 4.4).toFixed(2), halo: +(7 + t * 13).toFixed(1),
        c: n.c, haloC: n.c + '2e', deg: n.deg, title: n.title, tag: n.tag };
    });
    const ed = edges.map(([a, b]) => {
      const str = Math.min(1, (nodes[a].deg + nodes[b].deg) / (maxDeg * 1.7));
      const same = nodes[a].cluster === nodes[b].cluster;
      return { x1: out[a].x, y1: out[a].y, x2: out[b].x, y2: out[b].y,
        c: 'rgba(' + (same ? '188,183,226,' : '147,151,171,') + (0.10 + str * 0.20).toFixed(3) + ')',
        w: +(0.5 + str * 0.9).toFixed(2) };
    });
    const dust = [];
    for (let i = 0; i < 150; i++) dust.push({ x: +(rnd() * 1440).toFixed(1), y: +(rnd() * 900).toFixed(1), r: +(0.4 + rnd() * 0.9).toFixed(2), c: 'rgba(233,233,237,' + (0.03 + rnd() * 0.07).toFixed(3) + ')' });
    this._g = { nodes: out, edges: ed, dust, clusters };
    return this._g;
  }
  renderVals() {
    const g = this.build();
    const showLabels = this.props.showLabels ?? true;
    const dim = this.props.dim ?? false;
    const fi = this.props.focusIndex ?? -1;
    const fade = a => dim ? a.replace(/,([\d.]+)\)$/, (m, p) => ',' + (parseFloat(p) * 0.35).toFixed(3) + ')') : a;
    const nodes = g.nodes.map(n => dim ? Object.assign({}, n, { c: n.c + '55', haloC: n.c + '12' }) : n);
    const edges = g.edges.map(e => dim ? Object.assign({}, e, { c: fade(e.c) }) : e);
    const ranked = [];
    g.nodes.map((n, i) => ({ n, i })).sort((a, b) => b.n.deg - a.n.deg).forEach(o => {
      if (ranked.length >= 7) return;
      if (ranked.some(p => Math.abs(p.n.x - o.n.x) < 230 && Math.abs(p.n.y - o.n.y) < 26)) return;
      ranked.push(o);
    });
    const labels = showLabels && !dim ? ranked.map(({ n }) => ({
      style: { position: 'absolute', left: ((n.x + n.halo * 0.5 + 7) / 1440 * 100) + '%', top: ((n.y - 9) / 900 * 100) + '%',
        font: '400 11.5px/1.3 Inter, system-ui, sans-serif', letterSpacing: '0.01em', whiteSpace: 'nowrap',
        color: 'rgba(233,233,237,0.6)', pointerEvents: 'none' },
      t: n.title.length > 34 ? n.title.slice(0, 33) + '…' : n.title
    })) : [];
    const f = fi >= 0 && g.nodes[fi] ? g.nodes[fi] : null;
    const focus = f ? { x: f.x, y: f.y, ring: +(f.r + 9).toFixed(1), ring2: +(f.r + 22).toFixed(1),
      tx1: f.x - f.r - 34, tx2: f.x - f.r - 14, ty1: f.y - f.r - 34, ty2: f.y - f.r - 14 } : false;
    return { nodes, edges, dust: g.dust, labels, focus };
  }
}
</script>
</body>
</html>
